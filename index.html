<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Graph Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CSV Graph Visualizer</h1>
    <p class="subtitle">Upload a CSV file to automatically visualize your data</p>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">&#128202;</div>
      <p>Drag &amp; drop a CSV file here, or click to browse</p>
      <input type="file" id="fileInput" accept=".csv" hidden>
    </div>

    <div id="controls" class="controls hidden">
      <div class="control-group">
        <label for="chartType">Chart Type:</label>
        <select id="chartType">
          <option value="bar">Bar Chart</option>
          <option value="line">Line Chart</option>
          <option value="pie">Pie Chart</option>
          <option value="scatter">Scatter Plot</option>
          <option value="doughnut">Doughnut Chart</option>
        </select>
      </div>

      <div class="control-group">
        <label for="xAxis">X-Axis (Labels):</label>
        <select id="xAxis"></select>
      </div>

      <div class="control-group">
        <label for="yAxis">Y-Axis (Values):</label>
        <select id="yAxis"></select>
      </div>

      <button id="drawBtn" class="btn">Draw Graph</button>
    </div>

    <div id="chartContainer" class="chart-container hidden">
      <canvas id="chart"></canvas>
    </div>

    <div id="dataPreview" class="data-preview hidden">
      <h3>Data Preview</h3>
      <div id="previewTable"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
